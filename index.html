<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Farm Login</title>

<style>
  /* ... gaya seperti sebelumnya, untuk singkat saya skip di sini ... */
  body { font-family: Arial, sans-serif; background: #eef; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .login-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px #ccc; width: 320px; text-align: center; }
  .btn { width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
  .btn-google { background: white; border: 1px solid #ddd; color: #444; }
  .btn-phone { background: #1976d2; color: white; }
  .btn-login { background: #4caf50; color: white; }
  #recaptcha-container { margin: 20px auto; width: 300px; height: 78px; }
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  firebase.initializeApp({
    apiKey: "AIzaSyA_7XRkaGbP4tLISCAZwnvQdx2Doa6lbrc",
    authDomain: "block-90d40.firebaseapp.com",
    projectId: "block-90d40",
    storageBucket: "block-90d40.appspot.com",
    messagingSenderId: "552887299452",
    appId: "1:552887299452:web:c0769403af5f6abc7388f9",
    measurementId: "G-JMDQLHQVM0"
  });
</script>

</head>
<body>

<div class="login-card">
  <h2>🌱 Farm Login</h2>

  <button class="btn btn-login" onclick="loginDemo()">Login Demo</button>

  <button class="btn btn-google" onclick="loginGoogle()">
    <img src="Google_G_Logo.svg" alt="Google Logo" style="height:24px; vertical-align:middle; margin-right:8px;">
    Login Google
  </button>

  <button class="btn btn-phone" onclick="loginPhone()">Login HP</button>

  <div id="recaptcha-container"></div>
</div>

<script>
  let recaptchaVerifier;
  let confirmationResult;

  window.onload = function() {
    recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      size: 'normal',
      callback: () => { console.log('reCAPTCHA solved'); },
      'expired-callback': () => { console.log('reCAPTCHA expired'); }
    });

    recaptchaVerifier.render().then(widgetId => {
      console.log('reCAPTCHA widget rendered with id:', widgetId);
    });
  };

  function loginDemo() {
    alert("Login demo berhasil");
    window.location.href = "game.html";
  }

  function loginGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    firebase.auth().signInWithPopup(provider)
      .then(() => {
        console.log("Login Google sukses, redirect ke game.html");
        window.location.href = "game.html";
      })
      .catch(e => alert(e.message));
  }

  function loginPhone() {
    const phone = prompt("Masukkan nomor HP (contoh: +628xxxx)");
    if (!phone) return;

    if (!recaptchaVerifier) {
      alert('reCAPTCHA belum siap, silakan muat ulang halaman');
      return;
    }

    firebase.auth().signInWithPhoneNumber(phone, recaptchaVerifier)
      .then(result => {
        confirmationResult = result;
        const otp = prompt("Masukkan kode OTP");
        return confirmationResult.confirm(otp);
      })
      .then(() => {
        console.log("Login Phone sukses, redirect ke game.html");
        window.location.href = "game.html";
      })
      .catch(error => {
        alert(error.message);
        recaptchaVerifier.clear();
        recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'normal' });
        recaptchaVerifier.render();
      });
  }
</script>

</body>
</html>
