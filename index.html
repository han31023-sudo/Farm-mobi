<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Farm Login</title>

<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #7ec850; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .login-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 320px; text-align: center; }
  h2 { color: #2e7d32; margin-bottom: 20px; }
  .btn { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
  .btn:hover { opacity: 0.9; transform: translateY(-2px); }
  .btn-google { background: white; border: 1px solid #ddd; color: #444; }
  .btn-phone { background: #1976d2; color: white; }
  .btn-login { background: #4caf50; color: white; }
  #recaptcha-container { margin: 15px auto; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  // Konfigurasi Firebase Anda
  const firebaseConfig = {
    apiKey: "AIzaSyA_7XRkaGbP4tLISCAZwnvQdx2Doa6lbrc",
    authDomain: "block-90d40.firebaseapp.com",
    projectId: "block-90d40",
    storageBucket: "block-90d40.appspot.com",
    messagingSenderId: "552887299452",
    appId: "1:552887299452:web:c0769403af5f6abc7388f9",
    measurementId: "G-JMDQLHQVM0"
  };
  firebase.initializeApp(firebaseConfig);
</script>

</head>
<body>

<div class="login-card">
  <h2>🌱 Farm Login</h2>

  <button class="btn btn-login" onclick="loginDemo()">
    Masuk Mode Demo
  </button>

  <button class="btn btn-google" onclick="loginGoogle()">
    <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google" style="height:20px; margin-right:10px;">
    Login via Google
  </button>

  <button class="btn btn-phone" onclick="loginPhone()">
    Login via HP
  </button>

  <div id="recaptcha-container"></div>
</div>

<script>
  let recaptchaVerifier;
  let confirmationResult;

  // --- FUNGSI LOGIN GOOGLE (Diletakkan di luar agar bisa dipanggil onclick) ---
  function loginGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    // Coba pake Pop-up dulu
    firebase.auth().signInWithPopup(provider)
      .then((result) => {
        console.log("Sukses Login Google");
        window.location.href = "game.html";
      })
      .catch((error) => {
        console.error("Popup gagal, mencoba redirect...", error.message);
        // Jika Popup diblokir browser, gunakan Redirect
        firebase.auth().signInWithRedirect(provider);
      });
  }

  // Cek hasil redirect (jika login redirect digunakan)
  firebase.auth().getRedirectResult().then((result) => {
    if (result && result.user) {
      window.location.href = "game.html";
    }
  });

  // --- FUNGSI LOGIN DEMO ---
  function loginDemo() {
    alert("Masuk sebagai tamu...");
    window.location.href = "game.html";
  }

  // --- FUNGSI LOGIN PHONE ---
  function loginPhone() {
    const phone = prompt("Masukkan nomor HP (Contoh: +62812345678)");
    if (!phone) return;

    firebase.auth().signInWithPhoneNumber(phone, recaptchaVerifier)
      .then(result => {
        confirmationResult = result;
        const otp = prompt("Masukkan 6 digit kode OTP");
        return confirmationResult.confirm(otp);
      })
      .then(() => {
        window.location.href = "game.html";
      })
      .catch(error => {
        alert("Gagal: " + error.message);
      });
  }

  // Inisialisasi reCAPTCHA saat halaman dimuat
  window.onload = function() {
    recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      size: 'normal'
    });
    recaptchaVerifier.render();
  };
</script>

</body>
</html>
