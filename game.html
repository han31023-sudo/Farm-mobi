<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Farm Mobi - Game</title>

<style>
html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: Arial, sans-serif;
    background: #7ec850;
    display: flex;
    flex-direction: column;

    /* Disable all scroll & touch scroll */
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: auto;
}

/* ===== TOP HUD ===== */
.top-bar {
    height: 50px;
    background: #4caf50;
    color: white;
    display: flex;
    justify-content: space-around;
    align-items: center;
    font-size: 14px;
    flex-shrink: 0;
}

/* ===== FARM ===== */
.farm-container {
    flex-grow: 1; /* Fill available space */
    padding: 10px;
    /* Jangan beri overflow auto atau scroll */
    overflow: hidden;
}

.farm-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr); /* 5 kolom */
    grid-template-rows: repeat(7, 1fr);    /* 7 baris */
    gap: 6px;
    height: 100%;
}

.plot {
    background: #8d6e63;
    border-radius: 8px;
    aspect-ratio: 1 / 1; /* Kotak persegi */
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.plot img {
    width: 40px;
}

/* ===== BOTTOM BAR ===== */
.bottom-bar {
    height: 65px;
    background: #2e7d32;
    display: flex;
    justify-content: space-around;
    align-items: center;
    color: white;
    font-size: 11px;
    flex-shrink: 0;
    cursor: default;
}

.bottom-bar div {
    font-size: 16px;
    padding: 8px 0;
    text-align: center;
    cursor: pointer;
    user-select: none;
}

/* ===== HOME MENU ===== */
.home-menu {
    position: fixed;
    bottom: 65px;
    width: 100%;
    background: #ffffff;
    display: none;
    grid-template-columns: repeat(4, 1fr);
    text-align: center;
    border-top: 2px solid #ccc;
    z-index: 10;
}

.home-menu div {
    padding: 20px 0;
    font-size: 16px;
    cursor: pointer;
    user-select: none;
}

.bottom-bar div br,
.home-menu div br {
    line-height: 1.2;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="top-bar">
    <div>⭐ XP: <span id="xp">0</span></div>
    <div>🪙 Coin: <span id="coin">0</span></div>
    <div>💎 Diamond: <span id="diamond">0</span></div>
</div>

<!-- FARM -->
<div class="farm-container" id="content">
    <div class="farm-grid" id="farm"></div>
</div>

<!-- HOME SUB MENU -->
<div class="home-menu" id="homeMenu">
    <div onclick="openPage('farm')">🌾<br>Farm</div>
    <div onclick="openPage('silo')">🏚<br>Silo</div>
    <div onclick="openPage('barn')">🐮<br>Peternakan</div>
    <div onclick="openPage('garden')">🌳<br>Taman</div>
</div>

<!-- BOTTOM -->
<div class="bottom-bar">
    <div onclick="toggleHome()">🏠<br>Home</div>
    <div onclick="openPage('task')">📋<br>Task</div>
    <div onclick="openPage('barn')">🐄<br>Ternak</div>
    <div onclick="openPage('chat')">💬<br>Chat</div>
    <div onclick="openPage('leader')">🏆<br>Rank</div>
    <div onclick="openPage('pond')">🎣<br>Kolam</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// Firebase config & init
firebase.initializeApp({
    apiKey: "AIzaSyA_7XRkaGbP4tLISCAZwnvQdx2Doa6lbrc",
    authDomain: "block-90d40.firebaseapp.com",
    projectId: "block-90d40",
    storageBucket: "block-90d40.appspot.com",
    messagingSenderId: "552887299452",
    appId: "1:552887299452:web:c0769403af5f6abc7388f9",
    measurementId: "G-JMDQLHQVM0"
});

// Cek login user
firebase.auth().onAuthStateChanged(user => {
    if (user) {
        initGame();
    } else {
        alert("Kamu belum login! Silakan login dulu.");
        window.location.href = "index.html";
    }
});

var coin = 0, xp = 0, diamond = 0;

function initGame() {
    var farm = document.getElementById("farm");
    farm.innerHTML = "";
    for(let i=0; i<35; i++) {
        let plot = document.createElement("div");
        plot.className = "plot";
        plot.setAttribute("data","0");
        plot.innerHTML = '<img src="assets/shovel.png">';
        plot.onclick = function() { farmAction(this); }
        farm.appendChild(plot);
    }

    document.getElementById("coin").innerText = coin;
    document.getElementById("xp").innerText = xp;
    document.getElementById("diamond").innerText = diamond;
}

function farmAction(p) {
    let img = p.querySelector("img");
    let s = p.getAttribute("data");

    if(s == "0") {
        img.src = "assets/water.png";
        p.setAttribute("data","1");
    } else if(s == "1") {
        img.src = "assets/fertilizer.png";
        p.setAttribute("data","2");
    } else if(s == "2") {
        img.src = "assets/sickle.png";
        p.setAttribute("data","3");
    } else {
        img.src = "assets/shovel.png";
        p.setAttribute("data","0");
        coin += 10; xp += 2;
        document.getElementById("coin").innerText = coin;
        document.getElementById("xp").innerText = xp;
    }
}

function toggleHome(){
    let m = document.getElementById("homeMenu");
    m.style.display = (m.style.display == "grid") ? "none" : "grid";
}

function openPage(p){
    document.getElementById("homeMenu").style.display = "none";
    let c = document.getElementById("content");

    if(p == "task") c.innerHTML = "<h2>📋 Task Harian</h2>";
    else if(p == "chat") c.innerHTML = "<h2>💬 Chat Global</h2>";
    else if(p == "leader") c.innerHTML = "<h2>🏆 Leaderboard</h2>";
    else if(p == "pond") c.innerHTML = "<h2>🎣 Kolam Ikan</h2>";
    else if(p == "silo") c.innerHTML = "<h2>🏚 Silo Penyimpanan</h2>";
    else if(p == "barn") c.innerHTML = "<h2>🐮 Peternakan</h2>";
    else if(p == "garden") c.innerHTML = "<h2>🌳 Taman</h2>";
    else location.reload();
}
</script>

</body>
</html>
