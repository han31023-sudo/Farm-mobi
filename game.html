<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Farm Mobi - Grid 5x7 Fullscreen</title>

<style>
  /* Reset dan box sizing */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    overflow: hidden; /* Non-scrollable */
    font-family: Arial, sans-serif;
    background: #7ec850;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .top-bar {
    height: 50px;
    background: #4caf50;
    color: white;
    display: flex;
    justify-content: space-around;
    align-items: center;
    font-size: 14px;
    flex-shrink: 0;
    user-select: none;
  }

  /* Container grid */
  .farm-container {
    flex-grow: 1;
    padding: 0;
    width: 100vw;
    display: flex;
    flex-direction: column;
  }

  /* Grid 5x7 dengan ukuran kolom & baris dihitung */
  .farm-grid {
    display: grid;
    /* total width dikurangi gap (4 * 6px), bagi 5 kolom */
    grid-template-columns: repeat(5, calc((100vw - 4 * 6px) / 5));
    /* total height dikurangi top & bottom bar dan gap (6 * 6px), bagi 7 baris */
    grid-template-rows: repeat(7, calc((100vh - 50px - 65px - 6 * 6px) / 7));
    gap: 6px;
    width: 100vw;
    height: calc(100vh - 50px - 65px);
  }

  /* Setiap plot persegi dengan isi tengah */
  .plot {
    background: #8d6e63;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  .plot img {
    max-width: 80%;
    height: auto;
  }

  /* Bottom bar */
  .bottom-bar {
    height: 65px;
    background: #2e7d32;
    display: flex;
    justify-content: space-around;
    align-items: center;
    color: white;
    font-size: 16px;
    flex-shrink: 0;
    user-select: none;
  }

  .bottom-bar div {
    padding: 8px 0;
    text-align: center;
    cursor: pointer;
  }
</style>
</head>

<body>

  <div class="top-bar">
    <div>⭐ XP: <span id="xp">0</span></div>
    <div>🪙 Coin: <span id="coin">100</span></div>
    <div>💎 Diamond: <span id="diamond">0</span></div>
  </div>

  <div class="farm-container" id="content">
    <div class="farm-grid" id="farm"></div>
  </div>

  <div class="bottom-bar">
    <div onclick="alert('Home clicked')">🏠<br>Home</div>
    <div onclick="alert('Task clicked')">📋<br>Task</div>
    <div onclick="alert('Ternak clicked')">🐄<br>Ternak</div>
    <div onclick="alert('Chat clicked')">💬<br>Chat</div>
    <div onclick="alert('Rank clicked')">🏆<br>Rank</div>
    <div onclick="alert('Kolam clicked')">🎣<br>Kolam</div>
  </div>

  <script>
    let coin = 100, xp = 0, diamond = 0;

    function initGame() {
      const farm = document.getElementById("farm");
      farm.innerHTML = "";
      for(let i=0; i<35; i++) {
        const plot = document.createElement("div");
        plot.className = "plot";
        plot.setAttribute("data","0");
        plot.innerHTML = '<img src="assets/shovel.png" alt="shovel">';
        plot.onclick = function() { farmAction(this); };
        farm.appendChild(plot);
      }

      document.getElementById("coin").innerText = coin;
      document.getElementById("xp").innerText = xp;
      document.getElementById("diamond").innerText = diamond;
    }

    function farmAction(p) {
      const img = p.querySelector("img");
      const s = p.getAttribute("data");

      if(s === "0") {
        img.src = "assets/water.png";
        p.setAttribute("data","1");
      } else if(s === "1") {
        img.src = "assets/fertilizer.png";
        p.setAttribute("data","2");
      } else if(s === "2") {
        img.src = "assets/sickle.png";
        p.setAttribute("data","3");
      } else {
        img.src = "assets/shovel.png";
        p.setAttribute("data","0");
        coin += 10;
        xp += 2;
        document.getElementById("coin").innerText = coin;
        document.getElementById("xp").innerText = xp;
      }
    }

    window.onload = initGame;
  </script>

</body>
</html>
