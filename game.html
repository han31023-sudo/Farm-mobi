<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Farm Mobi - Unlock Slot with Level & Coin</title>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #7ec850;
    display: flex; flex-direction: column;
  }
  .top-bar {
    height: 50px;
    background: #4caf50;
    color: white;
    display: flex; justify-content: space-around; align-items: center;
    font-size: 14px;
    flex-shrink: 0;
    user-select: none;
  }
  .farm-container {
    flex-grow: 1;
    padding: 0;
    width: 100vw;
    display: flex;
    flex-direction: column;
  }
  .farm-grid {
    display: grid;
    grid-template-columns: repeat(5, calc((100vw - 4 * 6px) / 5));
    grid-template-rows: repeat(7, calc((100vh - 50px - 65px - 6 * 6px) / 7));
    gap: 6px;
    width: 100vw;
    height: calc(100vh - 50px - 65px);
  }
  .plot {
    background: #8d6e63;
    border-radius: 8px;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer;
    position: relative;
  }
  .plot.locked {
    background: #555;
    cursor: not-allowed;
    filter: grayscale(70%);
  }
  .plot.locked::after {
    content: "🔒";
    position: absolute;
    font-size: 24px;
    color: #fff;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .plot img {
    max-width: 80%;
    height: auto;
    pointer-events: none;
  }
  .bottom-bar {
    height: 65px;
    background: #2e7d32;
    display: flex;
    justify-content: space-around;
    align-items: center;
    color: white;
    font-size: 16px;
    flex-shrink: 0;
    user-select: none;
  }
  .bottom-bar div {
    padding: 8px 0;
    text-align: center;
    cursor: pointer;
  }
  .unlock-btn {
    background: #ffa000;
    border: none;
    color: white;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <div class="top-bar">
    <div>⭐ XP: <span id="xp">0</span></div>
    <div>🪙 Coin: <span id="coin">100</span></div>
    <div>💎 Diamond: <span id="diamond">0</span></div>
    <div>🔰 Level: <span id="level">1</span></div>
  </div>

  <div class="farm-container" id="content">
    <div class="farm-grid" id="farm"></div>
    <button class="unlock-btn" id="unlockBtn">Unlock Slot Land Berikutnya</button>
  </div>

  <div class="bottom-bar">
    <div onclick="alert('Home clicked')">🏠<br>Home</div>
    <div onclick="alert('Task clicked')">📋<br>Task</div>
    <div onclick="alert('Ternak clicked')">🐄<br>Ternak</div>
    <div onclick="alert('Chat clicked')">💬<br>Chat</div>
    <div onclick="alert('Rank clicked')">🏆<br>Rank</div>
    <div onclick="alert('Kolam clicked')">🎣<br>Kolam</div>
  </div>

<script>
  let coin = 100, xp = 0, diamond = 0;
  let level = 1;
  let unlockedSlots = 5; // awalnya 5 slot unlocked

  function initGame() {
    const farm = document.getElementById("farm");
    farm.innerHTML = "";

    for(let i=0; i<35; i++) {
      const plot = document.createElement("div");
      plot.className = "plot";

      if(i >= unlockedSlots) {
        plot.classList.add("locked");
      }

      plot.setAttribute("data", "0");
      plot.setAttribute("data-index", i);
      plot.innerHTML = '<img src="assets/shovel.png" alt="shovel">';
      plot.onclick = function() {
        if (i < unlockedSlots) {
          farmAction(this);
        } else {
          alert("Slot ini terkunci, silakan unlock dulu.");
        }
      };
      farm.appendChild(plot);
    }

    document.getElementById("coin").innerText = coin;
    document.getElementById("xp").innerText = xp;
    document.getElementById("diamond").innerText = diamond;
    document.getElementById("level").innerText = level;

    updateUnlockBtn();
  }

  function farmAction(plot) {
    const img = plot.querySelector("img");
    const state = plot.getAttribute("data");

    if(state === "0") {
      img.src = "assets/water.png";
      plot.setAttribute("data","1");
    } else if(state === "1") {
      img.src = "assets/fertilizer.png";
      plot.setAttribute("data","2");
    } else if(state === "2") {
      img.src = "assets/sickle.png";
      plot.setAttribute("data","3");
    } else {
      img.src = "assets/shovel.png";
      plot.setAttribute("data","0");
      coin += 10;
      xp += 2;
      // Update level sesuai XP (misal level naik tiap 20 xp)
      let newLevel = Math.floor(xp / 20) + 1;
      if(newLevel > level) level = newLevel;

      document.getElementById("coin").innerText = coin;
      document.getElementById("xp").innerText = xp;
      document.getElementById("level").innerText = level;
    }
  }

  function updateUnlockBtn() {
    const btn = document.getElementById("unlockBtn");

    if (unlockedSlots >= 35) {
      btn.style.display = "none"; // sudah full unlock, sembunyikan tombol
      return;
    }

    const nextPlot = unlockedSlots + 1; // plot berikutnya (1-based)
    const requiredLevel = nextPlot;      // minimal level sama dengan nomor plot
    const requiredCoin = (nextPlot - 5) * 100;

    btn.style.display = "block";
    btn.innerText = `Unlock Slot Land #${nextPlot} (Butuh Level ${requiredLevel} & ${requiredCoin} 🪙) - Saat ini: ${unlockedSlots}/35`;

    // Aktifkan tombol jika level & coin cukup
    btn.disabled = (level < requiredLevel || coin < requiredCoin);
  }

  document.getElementById("unlockBtn").onclick = function() {
    if (unlockedSlots >= 35) return;

    const nextPlot = unlockedSlots + 1;
    const requiredLevel = nextPlot;
    const requiredCoin = (nextPlot - 5) * 100;

    if(level >= requiredLevel && coin >= requiredCoin) {
      coin -= requiredCoin;
      unlockedSlots++;
      document.getElementById("coin").innerText = coin;

      initGame();
    } else {
      alert(`Tidak bisa unlock slot #${nextPlot}. Butuh Level ${requiredLevel} dan ${requiredCoin} 🪙.`);
    }
  };

  window.onload = initGame;
</script>

</body>
</html>
